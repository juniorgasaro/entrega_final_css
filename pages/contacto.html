                <input type="text" required placeholder="Tu nombre completo" name="nombre">

            <div class="labels">

                </select>
            </div>
            <div class="labels">
                <label for="msg-usuario">Deja tu mensaje</label>
                <textarea name="msg-usuario" id="msg-usuario" placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>
            <div class="labels">
                <button type="submit">Enviar</button>
            </div>
        </form>
